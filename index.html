<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>記帳本</title>
<meta name="theme-color" content="#1a6fe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --blue:#1a6fe8; --blue-bg:#e8f0fe; --green:#2e7d32; --green-bg:#e8f5e9;
  --red:#c62828; --red-bg:#fdecea; --orange:#e65100; --orange-bg:#fff3e0;
  --bg:#f5f5f5; --card:#fff; --border:#e8e8e8; --text:#1a1a1a; --sub:#888; --sub2:#aaa;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161616; --card:#232323; --border:#333; --text:#e8e8e8; --sub:#999; --sub2:#777;
    --blue-bg:#16324f; --green-bg:#1c3a1f; --red-bg:#4a2020; --orange-bg:#4a2f10; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px;}
.container{max-width:640px;margin:0 auto;padding:1rem 1rem 0;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.header h1{font-size:18px;font-weight:600;}
.month-total{font-size:12px;color:var(--sub);text-align:right;line-height:1.4;}
.month-total b{display:block;font-size:15px;color:var(--text);}
.backup-stat{display:flex;gap:10px;}
.backup-stat div{flex:1;background:var(--bg);border-radius:10px;padding:10px;text-align:center;}
.backup-stat .n{font-size:18px;font-weight:700;}
.backup-stat .l{font-size:11px;color:var(--sub);margin-top:2px;}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px;}
.section-title{font-size:13px;font-weight:600;color:var(--sub);margin:1.2rem 0 .6rem;text-transform:uppercase;letter-spacing:.03em;}
.section-title:first-child{margin-top:0;}

/* ---- Bottom Nav ---- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;background:none;border:none;color:var(--sub);font-size:11px;cursor:pointer;}
.nav-btn i{font-size:21px;}
.nav-btn.active{color:var(--blue);}

/* ---- Buttons / inputs ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;font-size:14px;font-weight:600;border-radius:10px;border:none;cursor:pointer;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{background:var(--blue-bg);color:var(--blue);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-block{width:100%;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:500;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=month],.field textarea,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;}
.field textarea{resize:vertical;min-height:56px;}
.amount-input{font-size:30px;font-weight:700;text-align:center;padding:14px !important;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
.seg button.active[data-pay=cash]{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.seg button.active[data-pay=credit]{background:var(--blue-bg);color:var(--blue);border-color:var(--blue);}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;color:var(--text);}
.cat-chip .ico{font-size:22px;}
.cat-chip.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}
.chk-row{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0;}
.chk-row input{width:18px;height:18px;}

/* ---- Photo / OCR ---- */
.photo-area{border:1.5px dashed var(--border);border-radius:12px;padding:1.4rem;text-align:center;color:var(--sub2);font-size:13px;cursor:pointer;position:relative;overflow:hidden;}
.photo-area i{font-size:26px;display:block;margin-bottom:6px;}
.photo-area img{max-width:100%;max-height:200px;border-radius:8px;display:block;margin:0 auto;}
.photo-area .remove-photo{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;}
.ocr-status{font-size:12.5px;color:var(--blue);display:flex;align-items:center;gap:6px;margin-top:8px;}
.ocr-status i{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- list ---- */
.day-group{margin-bottom:10px;}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:12.5px;color:var(--sub);}
.rec-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.rec-row .ico{font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:9px;flex-shrink:0;}
.rec-row .mid{flex:1;min-width:0;}
.rec-row .cat-name{font-size:14px;font-weight:500;}
.rec-row .note{font-size:12px;color:var(--sub2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-row .amt{font-size:15px;font-weight:700;text-align:right;flex-shrink:0;}
.rec-row .amt.cash{color:var(--green);}
.rec-row .amt.credit{color:var(--blue);}
.rec-row .tag-fixed{font-size:9.5px;background:var(--orange-bg);color:var(--orange);padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px;}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;}
.month-nav{display:flex;align-items:stretch;gap:6px;margin-bottom:10px;}
.month-nav input{flex:1;min-width:0;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;}
.month-nav button{width:42px;flex-shrink:0;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-nav button#m-all{width:auto;padding:0 14px;font-size:13px;font-weight:600;}
.month-nav button#m-all.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.month-nav input:disabled{opacity:.4;}
.date-quick{display:flex;gap:7px;margin-bottom:8px;}
.date-quick button{flex:1;padding:9px 0;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;}
.date-quick button.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600;}
.empty{text-align:center;padding:2.6rem 1rem;color:var(--sub2);font-size:13px;}
.empty i{font-size:30px;display:block;margin-bottom:10px;}

/* ---- stats ---- */
.period-tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.period-tabs button{flex:1;padding:9px;background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;}
.period-tabs button.active{background:var(--blue);color:#fff;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.summary-card .lbl{font-size:11.5px;color:var(--sub);margin-bottom:4px;}
.summary-card .val{font-size:19px;font-weight:700;}
.summary-card.total{grid-column:1/-1;background:linear-gradient(135deg,var(--blue),#0d47a1);color:#fff;}
.summary-card.total .lbl{color:rgba(255,255,255,.8);}
.summary-card.total .val{font-size:26px;}
.chart-wrap{position:relative;height:220px;margin:6px 0 14px;}
.cat-stat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.cat-stat-row:last-child{border-bottom:none;}
.cat-stat-row .bar-bg{flex:1;height:7px;border-radius:4px;background:var(--bg);overflow:hidden;}
.cat-stat-row .bar-fg{height:100%;background:var(--blue);border-radius:4px;}
.cat-stat-row .pct{font-size:11px;color:var(--sub2);width:38px;text-align:right;flex-shrink:0;}
.cat-stat-row .amt2{font-size:13px;font-weight:600;width:78px;text-align:right;flex-shrink:0;}

/* ---- settings ---- */
.cat-manage-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.cat-manage-row:last-child{border-bottom:none;}
.cat-manage-row .ico{font-size:20px;width:32px;text-align:center;}
.cat-manage-row .nm{flex:1;font-size:14px;}
.cat-manage-row .fixed-badge{font-size:10px;color:var(--orange);background:var(--orange-bg);padding:2px 6px;border-radius:5px;}
.icon-btn{background:none;border:none;color:var(--sub2);font-size:17px;cursor:pointer;padding:6px;}
.help{font-size:12px;color:var(--sub2);line-height:1.6;margin-top:10px;}
.ver-line{display:flex;align-items:center;justify-content:center;gap:14px;font-size:11.5px;color:var(--sub2);padding:16px 0 6px;}
.btn-link{background:none;border:none;color:var(--blue);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}
.help a{color:var(--blue);}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.overlay.show{display:flex;}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:1.2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom));}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-head h2{font-size:16px;}
.sheet-head button{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;}
.fab{position:fixed;right:20px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(26,111,232,.4);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.form-actions{display:flex;gap:10px;margin-top:6px;}

/* ---- quick actions / scan ---- */
.quick-actions{display:flex;gap:10px;margin-bottom:16px;}
.quick-actions .btn{flex:1;}
.btn-scan{background:var(--blue);color:#fff;}
.auto-hint{font-size:12px;color:var(--green);margin-top:6px;display:flex;align-items:center;gap:4px;}

/* ---- rules ---- */
.rule-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.rule-row:last-child{border-bottom:none;}
.rule-row .ico{font-size:19px;width:28px;text-align:center;flex-shrink:0;}
.rule-row .body{flex:1;min-width:0;}
.rule-row .nm{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.rule-row .kw{font-size:11.5px;color:var(--sub2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ---- invoice review ---- */
.inv-meta{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--sub);line-height:1.8;}
.inv-meta b{color:var(--text);font-size:15px;}
.inv-warn{background:var(--orange-bg);color:var(--orange);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-top:10px;display:flex;gap:7px;align-items:flex-start;}
.inv-item{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:7px;}
.inv-item input[type=checkbox]{width:18px;height:18px;flex-shrink:0;}
.inv-item .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inv-item .qty{font-size:11px;color:var(--sub2);}
.inv-item .amt{font-size:13.5px;font-weight:600;flex-shrink:0;}
.inv-item select{border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11.5px;padding:5px 4px;max-width:104px;flex-shrink:0;}
.inv-item.off{opacity:.42;}
.inv-summary{background:var(--blue-bg);color:var(--blue);border-radius:11px;padding:11px 13px;font-size:13px;margin:12px 0;line-height:1.7;}
.inv-summary b{font-size:16px;}

/* ---- scanner ---- */
.scanner{position:fixed;inset:0;background:#000;z-index:300;display:none;}
.scanner.show{display:block;}
.scanner video{width:100%;height:100%;object-fit:cover;}
.scan-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.scan-frame{width:74vw;max-width:330px;aspect-ratio:1;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);}
.scan-hint{position:absolute;left:0;right:0;bottom:118px;text-align:center;color:#fff;font-size:14px;padding:0 24px;line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.scan-actions{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;}
.scan-btn{background:rgba(255,255,255,.95);color:#111;border:none;padding:12px 26px;border-radius:26px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.scan-btn.ghost{background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.75);}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💰 記帳本</h1>
    <span class="month-total" id="header-total"></span>
  </div>

  <!-- 明細 -->
  <div id="page-list" class="page">
    <div class="month-nav">
      <button id="m-prev" aria-label="上個月"><i class="ti ti-chevron-left"></i></button>
      <input type="month" id="f-month">
      <button id="m-next" aria-label="下個月"><i class="ti ti-chevron-right"></i></button>
      <button id="m-all">全部</button>
    </div>
    <div class="filter-bar">
      <select id="f-pay"><option value="">全部方式</option><option value="cash">現金</option><option value="credit">信用卡</option></select>
      <select id="f-cat"><option value="">全部分類</option></select>
      <select id="f-fixed"><option value="">全部項目</option><option value="1">僅固定支出</option><option value="0">僅一般支出</option></select>
    </div>
    <div id="list-output"></div>
  </div>

  <!-- 統計 -->
  <div id="page-stats" class="page">
    <div class="period-tabs">
      <button data-period="day" class="active">日</button>
      <button data-period="month">月</button>
      <button data-period="year">年</button>
    </div>
    <div class="month-nav" id="period-picker-wrap"></div>
    <div class="summary-grid">
      <div class="summary-card total"><div class="lbl">總支出</div><div class="val" id="s-total">NT$0</div></div>
      <div class="summary-card"><div class="lbl">💵 現金</div><div class="val" id="s-cash">NT$0</div></div>
      <div class="summary-card"><div class="lbl">💳 信用卡</div><div class="val" id="s-credit">NT$0</div></div>
      <div class="summary-card"><div class="lbl">📌 固定支出</div><div class="val" id="s-fixed">NT$0</div></div>
      <div class="summary-card"><div class="lbl">🔄 一般支出</div><div class="val" id="s-variable">NT$0</div></div>
    </div>
    <div class="card" id="trend-card" style="display:none;">
      <div class="section-title" id="trend-title" style="margin-top:0;">趨勢</div>
      <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">分類佔比</div>
      <div class="chart-wrap" id="pie-wrap"><canvas id="pie-chart"></canvas></div>
      <div id="cat-stat-list"></div>
    </div>
  </div>

  <!-- 設定 -->
  <div id="page-settings" class="page">
    <div class="section-title" style="margin-top:0;">分類管理</div>
    <div class="card">
      <div id="cat-manage-list"></div>
      <button class="btn btn-ghost btn-block" id="add-cat-btn" style="margin-top:10px;"><i class="ti ti-plus"></i> 新增分類</button>
    </div>

    <div class="section-title">自動分類規則</div>
    <div class="card">
      <p class="help" style="margin-top:0;">掃描發票或輸入品項時，會依關鍵字自動判斷分類。由上往下比對，第一個命中的規則生效。</p>
      <div id="rule-list"></div>
      <button class="btn btn-ghost btn-block" id="add-rule-btn" style="margin-top:10px;"><i class="ti ti-plus"></i> 新增規則</button>
    </div>

    <div class="section-title">資料備份</div>
    <div class="card">
      <div class="backup-stat" id="backup-stat"></div>
      <div class="form-actions" style="margin-top:12px;">
        <button class="btn btn-ghost btn-block" id="export-btn"><i class="ti ti-download"></i> 匯出備份</button>
        <button class="btn btn-ghost btn-block" id="import-btn"><i class="ti ti-upload"></i> 匯入備份</button>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none;">
      <p class="help"><i class="ti ti-alert-triangle" style="color:var(--orange);"></i> 資料只存在這支手機裡。若清除瀏覽器資料或更換手機，紀錄會消失，建議定期匯出備份存到雲端硬碟或傳給自己。</p>
    </div>

    <div class="ver-line">
      <span>版本 <b id="app-ver"></b></span>
      <button class="btn-link" id="force-update-btn">檢查更新</button>
    </div>
  </div>
</div>

<button class="fab" id="fab-add"><i class="ti ti-plus"></i></button>

<div class="bottom-nav">
  <button class="nav-btn active" data-page="list"><i class="ti ti-receipt"></i>明細</button>
  <button class="nav-btn" data-page="stats"><i class="ti ti-chart-pie"></i>統計</button>
  <button class="nav-btn" data-page="settings"><i class="ti ti-settings"></i>設定</button>
</div>

<!-- Add/Edit record sheet -->
<div class="overlay" id="record-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="record-sheet-title">新增支出</h2><button id="record-close">&times;</button></div>

    <div class="quick-actions" id="quick-actions">
      <button class="btn btn-scan" id="scan-qr-btn"><i class="ti ti-qrcode"></i> 掃描發票</button>
      <button class="btn btn-ghost" id="quick-photo-btn"><i class="ti ti-camera"></i> 拍收據</button>
    </div>

    <div class="field"><input type="number" inputmode="decimal" class="amount-input" id="r-amount" placeholder="0" min="0"></div>

    <div class="field" id="photo-field" style="display:none;">
      <div class="photo-area" id="photo-area"></div>
      <div id="ocr-status" style="display:none;" class="ocr-status"><i class="ti ti-loader"></i><span>辨識中...</span></div>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;">

    <div class="field"><label>付款方式</label>
      <div class="seg" id="r-pay-seg">
        <button data-pay="cash" class="active">💵 現金</button>
        <button data-pay="credit">💳 信用卡</button>
      </div>
    </div>

    <div class="field"><label>分類</label><div class="cat-grid" id="r-cat-grid"></div></div>

    <div class="field"><label>日期</label>
      <div class="date-quick" id="date-quick">
        <button type="button" data-back="0">今天</button>
        <button type="button" data-back="1">昨天</button>

// ---- IndexedDB (local-only mode) ----
const IDB_NAME='ledger-db', IDB_VER=2;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'});
      if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories',{keyPath:'id'});
      if (!db.objectStoreNames.contains('rules')) db.createObjectStore('rules',{keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetAll(store){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function idbPut(store,value){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function idbDelete(store,id){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}

// IndexedDB getAll() returns rows keyed by id, so sort by the explicit order field
// to keep categories in a stable, user-meaningful sequence.
function sortCategories(){ categories.sort((a,b)=>(a.order??999)-(b.order??999)); }
function nextCatOrder(){ return categories.reduce((m,c)=>Math.max(m, c.order??0), 0) + 1; }
function sortRules(){ rules.sort((a,b)=>(a.order??999)-(b.order??999)); }
function nextRuleOrder(){ return rules.reduce((m,r)=>Math.max(m, r.order??0), 0) + 1; }

/* 依關鍵字規則推測分類；找不到就回傳 null（交由呼叫端決定預設值）。
   比對用小寫做不分大小寫的子字串比對，order 小的規則優先。 */
function classifyItem(name){
  if (!name) return null;
  const t = String(name).toLowerCase();
  for (const r of rules){
    if (!catById(r.category)) continue;      // 分類已被刪除的規則跳過
    for (const kw of r.keywords){
      const k = kw.trim().toLowerCase();
      if (k && t.includes(k)) return r.category;
    }
  }
  return null;
}

/* 內建資料的種子版本。往上加時只補「這個版本新增的」預設分類/規則，
   已存在的 id 一律不覆蓋，使用者刪掉的也不會被重新塞回來。 */
const SEED_VERSION = 3;

const seedRuleId = (cat, i) => 'seed-' + cat + '-' + i;
function buildSeedRules(){
  return DEFAULT_RULES.map(([cat, kws], i) => ({
    id: seedRuleId(cat, i), category: cat,
    keywords: kws.split(',').map(s=>s.trim()).filter(Boolean), order: i + 1,
  }));
}

async function loadLocal(){
  records = await idbGetAll('records');
  categories = await idbGetAll('categories');
  rules = await idbGetAll('rules');

  const seeded = parseInt(localStorage.getItem('ledger-seed') || '0', 10);
  if (!categories.length){
    categories = DEFAULT_CATEGORIES.slice();
    for (const c of categories) await idbPut('categories', c);
  } else if (seeded < 2){
    // v1 使用者：補上 v2 新增的三個分類，其餘保持原樣
    for (const c of DEFAULT_CATEGORIES){
      if (['produce','daily','fuel'].includes(c.id) && !categories.some(x=>x.id===c.id)){
        categories.push(c); await idbPut('categories', c);
      }
    }
  }
  if (!rules.length){
    rules = buildSeedRules();
    for (const r of rules) await idbPut('rules', r);
  } else if (seeded < 3){
    // 把新版補充的預設關鍵字併進既有的內建規則（自建規則完全不動）。
    // 例：發票印「九五無鉛」而舊規則只有「95無鉛」，靠這次合併補上「無鉛」。
    for (const s of buildSeedRules()){
      const cur = rules.find(r => r.id === s.id);
      if (!cur) { rules.push(s); await idbPut('rules', s); continue; }
      const merged = Array.from(new Set([...cur.keywords, ...s.keywords]));
      if (merged.length !== cur.keywords.length){
        cur.keywords = merged;
        await idbPut('rules', cur);
      }
    }
  }
  if (seeded < SEED_VERSION) localStorage.setItem('ledger-seed', String(SEED_VERSION));

  sortCategories();
  sortRules();
  onDataChanged();
}

/* =========================================================
   台灣電子發票證明聯 QR code 解析
   左方 QR 前 77 碼為定長標頭：
     發票號碼10 + 開立日期7(民國) + 隨機碼4 + 銷售額8(hex) + 總計額8(hex)
     + 買方統編8 + 賣方統編8 + 加密驗證24
   其後以 ':' 分隔：自訂區 : 本碼品項數 : 總品項數 : 編碼(0=Big5,1=UTF-8,2=Base64)
     : 品名 : 數量 : 單價 : 品名 : ...
   右方 QR 以 '**' 開頭，接續剩餘品項。
   ========================================================= */
const asciiOf = (a) => Array.from(a).map(c=>String.fromCharCode(c)).join('');

// Big5 的次位元組落在 0x40-0x7E / 0xA1-0xFE，永遠不會是 ':'(0x3A)，
// 因此可安全地在「解碼前」用位元組切割，再各自依編碼還原文字。
function splitBytes(bytes, sep){
  const out = []; let start = 0;
  for (let i=0;i<bytes.length;i++){ if (bytes[i]===sep){ out.push(bytes.slice(start,i)); start = i+1; } }
  out.push(bytes.slice(start));
  return out;
}
function decodeSeg(bytes, enc){
  try { return new TextDecoder(enc, {fatal:false}).decode(bytes); }
  catch(e){ try { return new TextDecoder('utf-8').decode(bytes); } catch(e2){ return asciiOf(bytes); } }
}
function itemsFromSegs(segs, enc){
  const items = [];
  for (let i=0;i+2<segs.length;i+=3){
    const name = decodeSeg(segs[i], enc).trim();
    const qty = parseFloat(asciiOf(segs[i+1])) || 1;
    const price = parseFloat(asciiOf(segs[i+2])) || 0;
    if (name) items.push({ name, qty, price, amount: Math.round(qty*price*100)/100 });
  }
  return items;
}

let lastInvoiceEnc = 'big5';   // 右方 QR 沿用左方宣告的編碼

function parseInvoiceQR(bytes){
  // 右方 QR（接續聯）
  if (bytes.length > 2 && bytes[0]===0x2A && bytes[1]===0x2A){
    const segs = splitBytes(bytes.slice(2), 0x3A).filter(s=>s.length);
    return { continuation:true, items: itemsFromSegs(segs, lastInvoiceEnc) };
  }
  if (bytes.length < 77) return null;
  const head = asciiOf(bytes.slice(0,77));
  if (!/^[A-Z]{2}\d{8}\d{7}/.test(head)) return null;   // 不像發票 QR

  const invNo = head.slice(0,10);
  const roc = head.slice(10,17);
  const total = parseInt(head.slice(29,37), 16);
  const sellerId = head.slice(45,53);
  const year = parseInt(roc.slice(0,3),10) + 1911;
  const date = `${year}-${roc.slice(3,5)}-${roc.slice(5,7)}`;

  let rest = bytes.slice(77);
  if (rest.length && rest[0]===0x3A) rest = rest.slice(1);
  const segs = splitBytes(rest, 0x3A);

  const encCode = asciiOf(segs[3] || []);
  let enc = encCode==='1' ? 'utf-8' : 'big5';
  let itemSegs = segs.slice(4);

  if (encCode === '2'){
    // 明細整段為 Base64，解開後再以 ':' 切割
    try {
      const b64 = segs.slice(4).map(s=>asciiOf(s)).join(':');
      const bin = atob(b64);
      const buf = Uint8Array.from(bin, c=>c.charCodeAt(0));
      itemSegs = splitBytes(buf, 0x3A);
      enc = 'big5';
    } catch(e){ itemSegs = []; }
  }
  lastInvoiceEnc = enc;

  return {
    continuation:false, invNo, date, total: isNaN(total) ? 0 : total, sellerId,
    declaredCount: parseInt(asciiOf(segs[2]||[]),10) || 0,
    items: itemsFromSegs(itemSegs, enc),
  };
}

   ========================================================= */
let scanStream = null, scanRAF = null;

async function startScanner(){
  const el = document.getElementById('scanner');

  }
  el.classList.add('show');
  hint.innerHTML = '載入掃描器...';
  try{
    if (!window.jsQR) await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
  }catch(e){
    hint.textContent = '掃描器載入失敗，請確認網路連線';
    return;
  }
  try{
    // 發票上兩個 QR 並排，各自佔的畫面很小，需要盡量高的來源解析度
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
  }catch(e){
    // 相機開不了時不要關掉畫面，留著讓使用者改用「用照片」
    hint.innerHTML = (e.name==='NotAllowedError'
        ? '沒有相機權限' : '無法開啟相機')
      + '<br><span style="font-size:12px;opacity:.85">可以改按下方「用照片」選一張發票照片</span>';
    return;
  }
  video.srcObject = scanStream;
  await video.play().catch(()=>{});
  try{   // 盡量讓鏡頭持續對焦，發票文字小、離太近容易糊掉
    const track = scanStream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')){
      await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] });
    }
  }catch(e){ /* 不支援就算了 */ }

  const DEFAULT_HINT = '將發票<b>左側</b>的 QR code 對準框內<br><span style="font-size:12px;opacity:.85">靠近一點，讓 QR 填滿約半個框</span>';
  hint.innerHTML = DEFAULT_HINT;
  let hintUntil = 0;
  const say = (html, ms) => { hint.innerHTML = html; hintUntil = Date.now() + ms; };

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  let frame = 0;

  // 在 canvas 指定區域上解碼；sw/sh 為來源裁切範圍，out 為輸出邊長
  const decodeRegion = (sx, sy, sw, sh, out, invert) => {
    canvas.width = out; canvas.height = Math.round(out * sh / sw);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return window.jsQR(img.data, img.width, img.height,
      { inversionAttempts: invert ? 'attemptBoth' : 'dontInvert' });
  };

  const tick = () => {
    if (!scanStream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      const vw = video.videoWidth, vh = video.videoHeight;
      frame++;
      // 交錯三種取樣：整張(高解析) → 中央放大 → 整張含反相，兼顧速度與命中率
      let code = null;
      const mode = frame % 3;
      if (mode === 0){
        code = decodeRegion(0, 0, vw, vh, Math.min(1280, vw), false);
      } else if (mode === 1){
        const s = Math.round(Math.min(vw, vh) * 0.8);
        code = decodeRegion((vw-s)/2, (vh-s)/2, s, s, Math.min(1000, s), false);
      } else {
        code = decodeRegion(0, 0, vw, vh, Math.min(960, vw), true);
      }

      if (code && code.binaryData && code.binaryData.length){
        const parsed = parseInvoiceQR(Uint8Array.from(code.binaryData));
        if (parsed && !parsed.continuation){ onScanned(parsed); return; }
        if (parsed && parsed.continuation){
          if (invoiceDraft){ onScanned(parsed); return; }
          say('掃到的是<b>右邊</b>那個 QR code<br><span style="font-size:12px;opacity:.85">請先對準<b>左邊</b>那個</span>', 1600);
        } else {
          say('這不是電子發票的 QR code', 1400);
        }
      } else if (Date.now() > hintUntil && hint.innerHTML !== DEFAULT_HINT){
        hint.innerHTML = DEFAULT_HINT;
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  scanRAF = requestAnimationFrame(tick);
}

/* 從照片解碼：靜態照片解析度遠高於即時影像，
   相機掃不到時（發票有皺褶、反光、油漬）這條路通常還能成功。 */
async function scanFromImageFile(file){
  const hint = document.getElementById('scan-hint');
  document.getElementById('scanner').classList.add('show');
  hint.textContent = '解析照片中...';
  try{
    if (!window.jsQR) await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
  }catch(e){ hint.textContent = '掃描器載入失敗，請確認網路連線'; return; }

  const img = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => { const im = new Image(); im.onload = ()=>res(im); im.onerror = rej; im.src = e.target.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const tryRegion = (sx, sy, sw, sh, out) => {
    canvas.width = Math.round(out); canvas.height = Math.round(out * sh / sw);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return window.jsQR(d.data, d.width, d.height, { inversionAttempts:'attemptBoth' });
  };

  const W = img.naturalWidth, H = img.naturalHeight;
  // 整張多種縮放 →左右半邊→四等分，逐步放大搜尋
  const regions = [
    [0,0,W,H,Math.min(1600,W)], [0,0,W,H,Math.min(1000,W)], [0,0,W,H,Math.min(2200,W)],
    [0,0,W/2,H,Math.min(1400,W/2)], [W/2,0,W/2,H,Math.min(1400,W/2)],
    [0,0,W/2,H/2,900], [W/2,0,W/2,H/2,900], [0,H/2,W/2,H/2,900], [W/2,H/2,W/2,H/2,900],
  ];
  for (const [sx,sy,sw,sh,out] of regions){
    let code = null;
    try { code = tryRegion(sx,sy,sw,sh,out); } catch(e){}
    if (code && code.binaryData && code.binaryData.length){
      const parsed = parseInvoiceQR(Uint8Array.from(code.binaryData));
      if (parsed && !parsed.continuation){ onScanned(parsed); return; }
      if (parsed && parsed.continuation && invoiceDraft){ onScanned(parsed); return; }
    }
    await new Promise(r=>setTimeout(r,0));   // 讓出執行緒，避免畫面凍住
  }
  hint.innerHTML = '這張照片讀不到發票 QR code<br><span style="font-size:12px;opacity:.85">請拍近一點、讓左邊那個 QR 清楚且填滿畫面</span>';
}

function stopScanner(){
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
  if (scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  const video = document.getElementById('scan-video');
  video.srcObject = null;
  document.getElementById('scanner').classList.remove('show');
}

function onScanned(parsed){
  stopScanner();
  if (parsed.continuation){
    if (!invoiceDraft){ toast('請先掃描發票左側的 QR code'); return; }
    const existing = new Set(invoiceDraft.items.map(i=>i.name));
    const added = parsed.items.filter(i=>!existing.has(i.name));
    invoiceDraft.items.push(...added.map(i=>({...i, category: classifyItem(i.name) || 'other', on:true })));
    reconcileDraft();
    renderInvoiceSheet();
    toast(added.length ? `已補上 ${added.length} 個品項` : '沒有新的品項');
    return;
  }
  invoiceDraft = {
    invNo: parsed.invNo, date: parsed.date, total: parsed.total,
    declaredCount: parsed.declaredCount, payment: 'cash',
    items: parsed.items.map(i => ({ ...i, category: classifyItem(i.name) || 'other', on:true })),
  };
  reconcileDraft();
  closeRecordSheet();
  renderInvoiceSheet();
  document.getElementById('invoice-overlay').classList.add('show');
}

/* =========================================================
   Invoice review sheet
   ========================================================= */
let invoiceDraft = null;

// QR 容量有限，部分店家只寫入前幾項或完全不寫明細。
// 用「差額」補一列，確保存進帳本的總額永遠等於發票總計額。
function reconcileDraft(){
  const d = invoiceDraft; if (!d) return;
  d.items = d.items.filter(i => !i.isDiff);
  const sum = d.items.reduce((s,i)=>s+i.amount, 0);
  const diff = Math.round((d.total - sum) * 100) / 100;
  if (d.total > 0 && Math.abs(diff) >= 1){
    // 差額為負代表店家有折扣（品項單價加總大於實付總額），照樣補一列讓總額對得起來
    d.items.push({ name: diff > 0 ? '其他（未列明細）' : '折扣／優惠',
                   qty:1, price:diff, amount:diff,
                   category:'other', on:true, isDiff:true });
  }
}

function renderInvoiceSheet(){
  const d = invoiceDraft; if (!d) return;
  const catOpts = (sel) => categories.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${c.icon} ${c.name}</option>`).join('');

  document.getElementById('inv-meta').innerHTML =
    `發票號碼 ${d.invNo || '—'}　${d.date}<br>發票總計 <b>${fmt(d.total)}</b>`;

  const realItems = d.items.filter(i=>!i.isDiff).length;
  const warn = document.getElementById('inv-warn');
  if (!realItems){
    warn.innerHTML = `<div class="inv-warn"><i class="ti ti-alert-triangle"></i><div>這張發票的 QR code 沒有品項明細（部分店家不寫入）。已用發票總額建立一筆，請自行選擇分類。</div></div>`;
  } else if (d.declaredCount && realItems < d.declaredCount){
    warn.innerHTML = `<div class="inv-warn"><i class="ti ti-info-circle"></i><div>這張發票共 ${d.declaredCount} 項，QR code 只放得下 ${realItems} 項。可再掃描發票<b>右側</b>的 QR code 補齊，或直接儲存（差額會歸到「其他」）。</div></div>`;
  } else { warn.innerHTML = ''; }

  document.getElementById('inv-items').innerHTML = d.items.map((it, idx) => `
    <div class="inv-item ${it.on?'':'off'}" data-idx="${idx}">
      <input type="checkbox" ${it.on?'checked':''} data-idx="${idx}" class="inv-chk">
      <div class="nm">${escapeHtml(it.name)}${it.qty>1?` <span class="qty">×${it.qty}</span>`:''}</div>
      <select class="inv-cat" data-idx="${idx}">${catOpts(it.category)}</select>
      <div class="amt">${fmt(it.amount)}</div>
    </div>`).join('');

  const on = d.items.filter(i=>i.on);
  const byCat = {};
  for (const i of on) byCat[i.category] = (byCat[i.category]||0) + i.amount;
  const groups = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  document.getElementById('inv-summary').innerHTML =
    `將存成 <b>${groups.length}</b> 筆，合計 <b>${fmt(on.reduce((s,i)=>s+i.amount,0))}</b><br>` +
    (groups.map(([c,a])=>{ const cc=catById(c); return `${cc?cc.icon+' '+cc.name:'?'} ${fmt(a)}`; }).join('　') || '（未選擇任何品項）');

  document.querySelectorAll('.inv-chk').forEach(el => el.addEventListener('change', () => {
    d.items[+el.dataset.idx].on = el.checked; renderInvoiceSheet();
  }));
  document.querySelectorAll('.inv-cat').forEach(el => el.addEventListener('change', () => {
    d.items[+el.dataset.idx].category = el.value; renderInvoiceSheet();
  }));
  document.querySelectorAll('#i-pay-seg button').forEach(b => b.classList.toggle('active', b.dataset.pay===d.payment));
}

document.getElementById('i-pay-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn || !invoiceDraft) return;
  invoiceDraft.payment = btn.dataset.pay;
  renderInvoiceSheet();
});
document.getElementById('invoice-close').addEventListener('click', () => {
  document.getElementById('invoice-overlay').classList.remove('show'); invoiceDraft = null;
});
document.getElementById('invoice-overlay').addEventListener('click', (e) => {
  if (e.target.id==='invoice-overlay'){ e.currentTarget.classList.remove('show'); invoiceDraft = null; }
});

document.getElementById('inv-save').addEventListener('click', async () => {
  const d = invoiceDraft; if (!d) return;
  const on = d.items.filter(i=>i.on && i.amount);
  if (!on.length){ toast('請至少選擇一個品項'); return; }
  // 同一張發票、同分類的品項合併成一筆
  const byCat = {};
  for (const i of on) (byCat[i.category] ||= []).push(i);
  const stamp = Date.now();
  for (const [catId, items] of Object.entries(byCat)){
    const cat = catById(catId);
    await saveRecord({
      id: uid(), date: d.date, amount: items.reduce((s,i)=>s+i.amount,0),
      category: catId, payment: d.payment, fixed: cat ? !!cat.fixed : false,
      note: items.map(i=>i.name + (i.qty>1?`×${i.qty}`:'')).join('、'),
      photo: null, invNo: d.invNo || null, createdAt: stamp,
    });
  }
  document.getElementById('invoice-overlay').classList.remove('show');
  const n = Object.keys(byCat).length;
  jumpToMonth(d.date);
  invoiceDraft = null;
  toast(`已存入 ${n} 筆記錄`);
});

  d.setDate(d.getDate() - n);

}

}

});

}
document.getElementById('quick-photo-btn').addEventListener('click', () => document.getElementById('photo-input').click());
document.getElementById('photo-area').addEventListener('click', (e) => {
  if (e.target.id === 'remove-photo-btn'){ currentPhoto=null; renderPhotoArea(); return; }
  document.getElementById('photo-input').click();
});
document.getElementById('photo-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const dataUrl = await compressImage(file, 1000, 0.65);
  currentPhoto = dataUrl;
  renderPhotoArea();
  runOcr(dataUrl);
});

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function runOcr(dataUrl){
  const statusEl = document.getElementById('ocr-status');
  document.getElementById('photo-field').style.display = 'block';
  statusEl.style.display = 'flex';
  statusEl.querySelector('span').textContent = '辨識中...';
  try{
    if (!window.Tesseract){
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    const { data } = await window.Tesseract.recognize(dataUrl, 'chi_tra+eng', {
      logger: (m) => { if (m.status==='recognizing text') statusEl.querySelector('span').textContent = `辨識中 ${Math.round((m.progress||0)*100)}%`; }
    });
    const text = data.text || '';
    const amount = parseAmountFromText(text);
    const msgs = [];
    if (amount){
      document.getElementById('r-amount').value = amount;
      msgs.push(`金額 NT$${amount}`);
    }
    // 收據文字同樣送進關鍵字規則，猜一個分類出來
    const hit = catTouched ? null : classifyItem(text);
    if (hit){
      selectedCat = hit;
      document.querySelectorAll('.cat-chip').forEach(x=>x.classList.toggle('active', x.dataset.cat===hit));
      const c = catById(hit);
      if (c){ document.getElementById('r-fixed').checked = !!c.fixed; msgs.push(`分類 ${c.icon}${c.name}`); }
    }
    statusEl.querySelector('span').textContent = msgs.length
      ? `已帶入 ${msgs.join('、')}，請確認` : '未偵測到金額，請手動輸入';
    setTimeout(()=>{ statusEl.style.display='none'; }, 3500);
  } catch(err){
    console.error(err);
    statusEl.querySelector('span').textContent = '辨識失敗，請手動輸入';
    setTimeout(()=>{ statusEl.style.display='none'; }, 2500);
  }
}
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
/* 從收據文字抓消費金額。
   關鍵：發票上「隨機碼 9321  總計 113」常印在同一行，所以必須取
   關鍵字「後面緊接」的那個數字，不能拿整行的最大值。 */
function parseAmountFromText(text){
  // 數字越可信的欄位優先權越高
  const KEYS = [
    ['應付金額',10],['實付金額',10],['應收金額',10],['消費金額',10],['總金額',10],
    ['總計',9],['合計',9],['total',9],
    ['應付',8],['實付',8],['現金',6],['小計',5],['金額',4],
  ];
  // 這些欄位後面的數字絕不是消費金額
  const BLOCK = /(隨機碼|發票號碼|統一編號|統編|賣方|買方|收銀|機號|序號|卡號|會員|電話|地址|營業人|課稅別|格式|載具)/;

  const lines = String(text).split(/\n/).map(l => l.replace(/\s+/g,' ').trim()).filter(Boolean);
  let best = null;

  for (const line of lines){
    const low = line.toLowerCase();
    for (const [kw, pri] of KEYS){
      const i = low.indexOf(kw.toLowerCase());
      if (i < 0) continue;
      const after = line.slice(i + kw.length);
      // 關鍵字與數字間可能夾雜 : ： $ NT 等符號
      const m = after.match(/^[\s:：=$＄]*(?:NT|nt|新台幣|元)?[\s:：$＄]*(\d[\d,]*(?:\.\d{1,2})?)/)
             || after.match(/(\d[\d,]*(?:\.\d{1,2})?)/);
      if (!m) continue;
      const v = parseFloat(m[1].replace(/,/g,''));
      if (!(v > 0) || v >= 1000000) continue;
      if (!best || pri > best.pri) best = { v, pri };
    }
  }
  if (best) return best.v;

  // 完全沒抓到關鍵字時的備援：先排除明顯不是金額的行與長數字，再取最大值
  const pool = [];
  for (const line of lines){
    if (BLOCK.test(line)) continue;
    if (/\d{4}[-\/年]\d{1,2}[-\/月]\d{1,2}/.test(line)) continue;    // 日期
    if (/[A-Z]{2}[-\s]?\d{8}/.test(line)) continue;                  // 發票字軌號碼
    for (const t of (line.match(/\d[\d,]*(?:\.\d{1,2})?/g) || [])){
      const raw = t.replace(/,/g,'');
      if (/^\d{7,}$/.test(raw)) continue;                            // 統編等長數字
      const v = parseFloat(raw);
      if (v > 0 && v < 1000000) pool.push(v);
    }
  }
  if (!pool.length) return null;
  pool.sort((a,b)=>b-a);
  return pool[0];
}

let editingCatId = null;
function openCatSheet(id){
  editingCatId = id || null;
  const cat = id ? catById(id) : null;

document.getElementById('c-save').addEventListener('click', async () => {

                order: existing ? existing.order : nextCatOrder() };

  await deleteCategory(editingCatId);
  document.getElementById('cat-overlay').classList.remove('show');

});

/* =========================================================
   List (明細) rendering
   ========================================================= */
function currentFilters(){
  return {
    month: monthAll ? '' : document.getElementById('f-month').value,
    pay: document.getElementById('f-pay').value,
    cat: document.getElementById('f-cat').value,
    fixed: document.getElementById('f-fixed').value,
  };
}
function filteredRecords(){
  const f = currentFilters();
  return records.filter(r => {
    if (f.month && !r.date.startsWith(f.month)) return false;
    if (f.pay && r.payment !== f.pay) return false;
    if (f.cat && r.category !== f.cat) return false;
    if (f.fixed === '1' && !r.fixed) return false;
    if (f.fixed === '0' && r.fixed) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}
function renderList(){
  const out = document.getElementById('list-output');
  const list = filteredRecords();
  if (!list.length){ out.innerHTML = '<div class="empty"><i class="ti ti-receipt-off"></i>目前沒有符合條件的紀錄</div>'; return; }
  const groups = {};
  for (const r of list){ (groups[r.date] ||= []).push(r); }
  const dates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  out.innerHTML = dates.map(date => {
    const items = groups[date];
    const subtotal = items.reduce((s,r)=>s+r.amount,0);
    const rows = items.map(r => {
      const c = catById(r.category) || {icon:'❓',name:'未分類'};
      return `<div class="rec-row" data-id="${r.id}">
        <div class="ico">${c.icon}</div>
        <div class="mid"><div class="cat-name">${c.name}${r.fixed?'<span class="tag-fixed">固定</span>':''}</div>${r.note?`<div class="note">${escapeHtml(r.note)}</div>`:''}</div>
        <div class="amt ${r.payment}">${r.payment==='cash'?'':'-'}${fmt(r.amount)}</div>
      </div>`;
    }).join('');
    return `<div class="day-group"><div class="day-head"><span>${formatDateLabel(date)}</span><span>小計 ${fmt(subtotal)}</span></div>${rows}</div>`;
  }).join('');
  out.querySelectorAll('.rec-row').forEach(el => el.addEventListener('click', () => {
    const rec = records.find(r=>r.id===el.dataset.id);
    if (rec) openRecordSheet(rec);
  }));
}
function formatDateLabel(d){
  const dt = new Date(d+'T00:00:00');
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${d} (${weekdays[dt.getDay()]})`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('f-month').value = todayStr().slice(0,7);

function shiftMonth(delta){
  const el = document.getElementById('f-month');
  const [y, m] = (el.value || todayStr().slice(0,7)).split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  el.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  setMonthAll(false);
  renderList();
}
function setMonthAll(on){
  monthAll = on;
  document.getElementById('m-all').classList.toggle('active', on);
  document.getElementById('f-month').disabled = on;
}

/* =========================================================
   Stats (統計) rendering
   ========================================================= */
let statsPeriod = 'day';
let statsDate = todayStr();
let statsMonth = todayStr().slice(0,7);
let statsYear = String(new Date().getFullYear());
let pieChart = null, trendChart = null;

document.querySelectorAll('.period-tabs button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.period-tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  statsPeriod = btn.dataset.period;
  renderStats();
}));

function shiftPeriod(delta){
  if (statsPeriod === 'day'){
    const d = new Date(statsDate + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    statsDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  } else if (statsPeriod === 'month'){
    const [y,m] = statsMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    statsMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  } else {
    statsYear = String(parseInt(statsYear,10) + delta);
  }
  renderStats();
}

function renderPeriodPicker(){
  const wrap = document.getElementById('period-picker-wrap');
  const input = statsPeriod === 'day'  ? `<input type="date" id="period-input" value="${statsDate}">`
              : statsPeriod === 'month'? `<input type="month" id="period-input" value="${statsMonth}">`
              : `<input type="number" id="period-input" value="${statsYear}" min="2000" max="2100">`;
  wrap.innerHTML =
    `<button id="p-prev"><i class="ti ti-chevron-left"></i></button>${input}<button id="p-next"><i class="ti ti-chevron-right"></i></button>`;

  document.getElementById('p-prev').addEventListener('click', () => shiftPeriod(-1));
  document.getElementById('p-next').addEventListener('click', () => shiftPeriod(1));
  document.getElementById('period-input').addEventListener('change', (e) => {
    if (statsPeriod==='day') statsDate = e.target.value;
    else if (statsPeriod==='month') statsMonth = e.target.value;
    else statsYear = e.target.value;
    renderStats();
  });
}

function recordsForPeriod(){
  if (statsPeriod==='day') return records.filter(r=>r.date===statsDate);
  if (statsPeriod==='month') return records.filter(r=>r.date.startsWith(statsMonth));
  return records.filter(r=>r.date.startsWith(statsYear));
}

function renderStats(){
  renderPeriodPicker();
  const list = recordsForPeriod();
  const total = list.reduce((s,r)=>s+r.amount,0);
  const cash = list.filter(r=>r.payment==='cash').reduce((s,r)=>s+r.amount,0);
  const credit = list.filter(r=>r.payment==='credit').reduce((s,r)=>s+r.amount,0);
  const fixed = list.filter(r=>r.fixed).reduce((s,r)=>s+r.amount,0);
  const variable = total - fixed;
  document.getElementById('s-total').textContent = fmt(total);
  document.getElementById('s-cash').textContent = fmt(cash);
  document.getElementById('s-credit').textContent = fmt(credit);
  document.getElementById('s-fixed').textContent = fmt(fixed);
  document.getElementById('s-variable').textContent = fmt(variable);

  // category breakdown
  const byCat = {};
  for (const r of list){ byCat[r.category] = (byCat[r.category]||0) + r.amount; }
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const listEl = document.getElementById('cat-stat-list');
  if (!rows.length){
    listEl.innerHTML = '<div class="empty" style="padding:1.4rem;">此期間尚無資料</div>';
  } else {
    listEl.innerHTML = rows.map(([catId,amt]) => {
      const c = catById(catId) || {icon:'❓',name:'未分類'};
      const pct = total ? (amt/total*100) : 0;
      return `<div class="cat-stat-row">
        <span style="font-size:18px;">${c.icon}</span>
        <span style="font-size:13px;flex-shrink:0;width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.name}</span>
        <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;"></div></div>
        <span class="pct">${pct.toFixed(0)}%</span>
        <span class="amt2">${fmt(amt)}</span>
      </div>`;
    }).join('');
  }

  renderPieChart(rows);
  renderTrendChart(list);
}

const PALETTE = ['#1a6fe8','#2e7d32','#e65100','#c62828','#6a1b9a','#00838f','#ad1457','#f9a825','#546e7a','#5d4037','#00695c'];
function renderPieChart(rows){
  const ctx = document.getElementById('pie-chart');
  const labels = rows.map(([id]) => { const c=catById(id); return c ? c.icon+' '+c.name : '未分類'; });
  const data = rows.map(([,amt]) => amt);
  if (pieChart) pieChart.destroy();
  if (!rows.length){ return; }
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: PALETTE }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } } }
  });
}

function renderTrendChart(periodList){
  const card = document.getElementById('trend-card');
  const title = document.getElementById('trend-title');
  const ctx = document.getElementById('trend-chart');
  if (trendChart){ trendChart.destroy(); trendChart=null; }
  if (statsPeriod === 'day'){ card.style.display='none'; return; }
  card.style.display='block';
  let labels, sums;
  if (statsPeriod === 'month'){
    title.textContent = '每日支出趨勢';
    const [y,m] = statsMonth.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    labels = Array.from({length:daysInMonth}, (_,i)=>String(i+1));
    sums = new Array(daysInMonth).fill(0);
    for (const r of periodList){ const d = parseInt(r.date.slice(8,10),10); sums[d-1]+=r.amount; }
  } else {
    title.textContent = '每月支出趨勢';
    labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    sums = new Array(12).fill(0);
    for (const r of periodList){ const mo = parseInt(r.date.slice(5,7),10); sums[mo-1]+=r.amount; }
  }
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: sums, backgroundColor:'#1a6fe8', borderRadius:4 }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true, ticks:{font:{size:10}} }, x:{ ticks:{font:{size:10}} } } }
  });
}

/* Service Worker：註冊後主動檢查更新。新版接手控制權時自動重新載入一次，
   避免手機停在舊版畫面（舊版 cache-first 就是這樣卡住的）。 */
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.update().catch(()=>{});
    setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
  }).catch(()=>{});
}
